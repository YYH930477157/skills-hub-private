[project]
name = "skillhub"
version = "0.1.0"
description = "Company Agent Skills registry, catalog, and IDE marketplace source"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
skillhub = "skillhub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skillhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
