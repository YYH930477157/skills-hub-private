server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://host.docker.internal:8000; proxy_set_header Host $host; }
  location /.well-known/ { proxy_pass http://host.docker.internal:8000; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
